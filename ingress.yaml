apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: shop-ingress
  namespace: boutique
  annotations:
    networking.istio.io/service-type: NodePort
spec:
  gatewayClassName: istio
  listeners:
  - name: http
    port: 80
    protocol: HTTP
    allowedRoutes: {namespaces: {from: Same}}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frontend
  namespace: boutique
spec:
  parentRefs: [{name: shop-ingress}]
  rules:
  - backendRefs: [{name: frontend, port: 80}]
