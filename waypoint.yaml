apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: waypoint
  namespace: boutique
  labels:
    istio.io/waypoint-for: all
spec:
  gatewayClassName: istio-waypoint
  listeners:
  - name: mesh
    port: 15008
    protocol: HBONE
---
apiVersion: telemetry.istio.io/v1
kind: Telemetry
metadata:
  name: mesh-otel
  namespace: boutique
spec:
  tracing:
  - providers:
    - name: tinyolly-otel
    randomSamplingPercentage: 100
  accessLogging:
  - providers:
    - name: tinyolly-otel-als
